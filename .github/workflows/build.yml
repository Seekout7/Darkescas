name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: yes | flutter doctor --android-licenses || true

      - name: Android platformu (main.dart'a dokunmaz)
        run: |
          flutter create --platforms=android --org com.darkescas --project-name darkescas _tmp
          rm -rf android
          cp -r _tmp/android .
          cp _tmp/.metadata . 2>/dev/null || true
          rm -rf _tmp
          chmod +x android/gradlew 2>/dev/null || true

      - name: INTERNET izinleri (LAN/UDP icin sart)
        run: |
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n        <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n        <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <application|' android/app/src/main/AndroidManifest.xml
            echo "izinler eklendi"
          fi

      - run: flutter pub get

      - name: Dart hata kontrolu (varsa ACIK yazar)
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "=============================================="
            echo "DART HATASI VAR - bu adimin logunda yukariya bak,"
            echo "'error - lib/main.dart:SATIR' satirini goreceksin."
            echo "=============================================="
            exit 1
          fi
          echo "Dart kodu temiz."

      - name: DEBUG APK (ANA BUILD - her zaman calisir)
        run: flutter build apk --debug

      - name: RELEASE APK (opsiyonel - patlasa da onemli degil)
        continue-on-error: true
        run: flutter build apk --release

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: darkescas-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
