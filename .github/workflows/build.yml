name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Android platform (to temp folder, protect main.dart)
        run: |
          flutter create --platforms=android --org com.darkescas --project-name darkescas _tmp
          rm -rf android
          cp -r _tmp/android .
          cp -r _tmp/.metadata . 2>/dev/null || true
          rm -rf _tmp

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: darkescas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
