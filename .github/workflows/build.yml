name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
      - run: yes | flutter doctor --android-licenses || true
      - run: flutter create --platforms=android --org com.karanlikpizzaci --project-name darkescas .
      - run: flutter pub get
      - name: Build APK (hatayı alta yaz)
        run: |
          flutter build apk --release 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "================ GERCEK HATA ================"
            grep -iE "error|failed|exception" build.log | tail -n 40
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/app/outputs/flutter-apk/app-release.apk
